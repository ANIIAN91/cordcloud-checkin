name: CordCloud

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cordcloud-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Random Delay
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          delay=$(( RANDOM % 600 ))
          echo "sleep ${delay}s"
          sleep "$delay"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          google-chrome --version
          command -v xvfb-run
      - name: Regression tests
        run: python -m unittest -v test.py
      - name: Check in with fresh Patchright login
        env:
          INPUT_EMAIL: ${{ secrets.CC_EMAIL }}
          INPUT_PASSWD: ${{ secrets.CC_PASSWD }}
          INPUT_SECRET: ${{ secrets.CC_SECRET }}
          INPUT_VERIFY_METHOD: ga
          INPUT_HOST: cordcloud.biz
          INPUT_TRUST_DEVICE: 'false'
          INPUT_TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          INPUT_TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run -a python -u main.py
